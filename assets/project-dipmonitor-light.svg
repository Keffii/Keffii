<svg xmlns="http://www.w3.org/2000/svg" width="410" height="257" viewBox="0 0 410 257" role="img"><title>Voltage Dip Monitor (built during internship): Samples three channels at 100 Hz, detects dips against a tracked baseline and shows them on an OLED. Caught dips within 10 ms in testing. Streams to InfluxDB and Grafana over USB. Built with MicroPython, Pico 2, InfluxDB, Grafana.</title><style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}</style><rect x="0.5" y="0.5" width="409" height="256" rx="14" fill="#f7f9fb" stroke="#d6dde4"/><text x="24.0" y="40.0" font-size="19" font-weight="700" fill="#1b2128" text-anchor="start">Voltage Dip Monitor</text><text x="386.0" y="40.0" font-size="16" font-weight="400" fill="#5a6672" text-anchor="end">↗</text><text x="24.0" y="62.0" font-size="12" font-weight="400" fill="#0b8a5c" text-anchor="start">built during internship</text><text x="24.0" y="92.0" font-size="13" font-weight="400" fill="#5a6672" text-anchor="start">Samples three channels at 100 Hz, detects</text><text x="24.0" y="111.0" font-size="13" font-weight="400" fill="#5a6672" text-anchor="start">dips against a tracked baseline and shows</text><text x="24.0" y="130.0" font-size="13" font-weight="400" fill="#5a6672" text-anchor="start">them on an OLED. Caught dips within 10 ms in</text><text x="24.0" y="149.0" font-size="13" font-weight="400" fill="#5a6672" text-anchor="start">testing. Streams to InfluxDB and Grafana over</text><text x="24.0" y="168.0" font-size="13" font-weight="400" fill="#5a6672" text-anchor="start">USB.</text><rect x="24.0" y="215" width="91.8" height="20" rx="5" fill="#eaf0f4" stroke="#d6dde4"/><text x="69.9" y="229.0" font-size="11" font-weight="400" fill="#1b2128" text-anchor="middle">MicroPython</text><rect x="121.8" y="215" width="58.3" height="20" rx="5" fill="#eaf0f4" stroke="#d6dde4"/><text x="150.9" y="229.0" font-size="11" font-weight="400" fill="#1b2128" text-anchor="middle">Pico 2</text><rect x="186.1" y="215" width="71.7" height="20" rx="5" fill="#eaf0f4" stroke="#d6dde4"/><text x="221.9" y="229.0" font-size="11" font-weight="400" fill="#1b2128" text-anchor="middle">InfluxDB</text><rect x="263.8" y="215" width="65.0" height="20" rx="5" fill="#eaf0f4" stroke="#d6dde4"/><text x="296.2" y="229.0" font-size="11" font-weight="400" fill="#1b2128" text-anchor="middle">Grafana</text></svg>
